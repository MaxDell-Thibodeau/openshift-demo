spring:
  application:
    name: openshift-demo
  datasource:
    driverClassName: org.h2.Driver
    generate-unique-name: false
    name: countries
    password: ${DB_PASSWORD}
    url: jdbc:h2:mem:openshift-demo
    username: ${DB_USERNAME}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      format_sql: true
    show-sql: true
developer:
  name: ${DEVELOPER_NAME}