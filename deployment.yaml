apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-demo
  template:
    metadata:
      labels:
        app: openshift-demo
    spec:
      containers:
        - name: openshift-demo
          image: docker.io/maxd4637/openshift-demo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openshift-demo-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openshift-demo-db
                  key: DB_PASSWORD
            - name: DEVELOPER_NAME
              valueFrom:
                secretKeyRef:
                  name: openshift-demo-db
                  key: DEVELOPER_NAME
